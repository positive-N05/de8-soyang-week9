# 9주차 과제 전체 구성 (EC2 t3.large 한 대)
# Kafka 브로커 3대 + kafka-ui + Spark standalone(master 1, worker 1) + Airflow
# 실행: cd part1-ev && docker compose up -d --build

name: de9

services:
  # ---------------- Kafka (KRaft, broker + controller 겸용) ----------------
  # 컨테이너끼리는 INTERNAL(kafkaN:19092), EC2 호스트의 파이썬 스크립트는 EXTERNAL(localhost:9092~9094)로 접속
  kafka1:
    image: apache/kafka:3.7.0
    container_name: kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: zl93gmg1RSC5Igf9nSzrNQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # 컨슈머 2개를 동시에 띄우면 첫 리밸런싱에서 같이 파티션을 나눠 받도록 10초 대기
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 10000
      # 과제 기간 동안 메시지가 지워지지 않게 시간 기준 보존 제한 해제
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    image: apache/kafka:3.7.0
    container_name: kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: zl93gmg1RSC5Igf9nSzrNQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 10000
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    image: apache/kafka:3.7.0
    container_name: kafka3
    hostname: kafka3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: zl93gmg1RSC5Igf9nSzrNQ
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093,2@kafka2:29093,3@kafka3:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 10000
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_HEAP_OPTS: -Xms384m -Xmx384m
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # ---------------- kafka-ui ----------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: de9-yso-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092,kafka2:19092,kafka3:19092
      JAVA_OPTS: -Xmx256m
    depends_on:
      - kafka1
      - kafka2
      - kafka3

  # ---------------- Spark standalone ----------------
  # 레포 전체를 /opt/de9 로 연결해서 spark-submit 할 때 코드를 그대로 사용
  # spark-work 볼륨은 master(드라이버)와 worker(실행기)가 같이 쓰는 체크포인트 저장 위치
  spark-master:
    image: apache/spark:3.5.4-python3
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master --port 7077 --webui-port 8080
    environment:
      SPARK_DAEMON_MEMORY: 256m
    ports:
      - "8081:8080"
    volumes:
      - ..:/opt/de9
      - spark-work:/opt/spark/work-dir

  spark-worker:
    image: apache/spark:3.5.4-python3
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --cores 2 --memory 1536m spark://spark-master:7077
    environment:
      SPARK_DAEMON_MEMORY: 256m
    volumes:
      - ..:/opt/de9
      - spark-work:/opt/spark/work-dir
    depends_on:
      - spark-master

  # ---------------- Airflow (Spark 클러스터에 제출할 수 있게 직접 만든 이미지) ----------------
  airflow:
    build:
      context: ../part2-price/airflow
    image: de9-airflow:2.10.5
    container_name: airflow
    hostname: airflow
    command: standalone
    ports:
      - "8090:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__WORKERS: 1
      AIRFLOW__CORE__DAGS_FOLDER: /opt/de9/part2-price/dags
      AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ..:/opt/de9
      - airflow-home:/opt/airflow
    depends_on:
      - spark-master

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:
  spark-work:
  airflow-home:
